name: Deploy API (production)

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/db/**'
      - 'packages/shared/**'
      - 'packages/eslint-config/**'
      - 'packages/typescript-config/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'Dockerfile'
      - 'docker-compose.prod.yml'
      - '.dockerignore'
      - '.github/workflows/deploy-api-production.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fix60-api:latest
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package image
        run: docker save fix60-api:latest | gzip > fix60-api.tar.gz

      - name: Upload image and compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'fix60-api.tar.gz,docker-compose.prod.yml'
          target: ${{ secrets.EC2_APP_PATH }}

      - name: Migrate and restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_PATH: ${{ secrets.EC2_APP_PATH }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_PATH
          script: |
            set -euo pipefail
            cd "$APP_PATH"
            test -f shared/.env || { echo "shared/.env missing on host"; exit 1; }
            gunzip -c fix60-api.tar.gz | docker load
            docker compose -f docker-compose.prod.yml run --rm api node node_modules/@fix60/db/dist/migrate.js
            docker compose -f docker-compose.prod.yml up -d
            rm -f fix60-api.tar.gz
            docker image prune -f
